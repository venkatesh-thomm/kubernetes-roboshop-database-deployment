# -----------------------------------------
# 1) REDIS SERVICE (ClusterIP)
# -----------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: roboshop
spec:
  selector:
    project: roboshop
    component: redis
    tier: db
  ports:
    - protocol: TCP
      port: 6379        # Redis service port
      targetPort: 6379  # Redis container port

---
# -----------------------------------------
# 2) REDIS HEADLESS SERVICE (For StatefulSet DNS)
# -----------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: roboshop
spec:
  clusterIP: None       # Required for StatefulSet stable network identity
  selector:
    project: roboshop
    component: redis
    tier: db
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379

---
# -----------------------------------------
# 3) REDIS STATEFULSET
# -----------------------------------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: roboshop
spec:
  serviceName: "redis-headless"   # Must match headless service name
  replicas: 2
  selector:
    matchLabels:
      project: roboshop
      component: redis
      tier: db
  template:
    metadata:
      labels:
        project: roboshop
        component: redis
        tier: db
    spec:
      containers:
      - name: redis
        image: redis:7.0

        # Persistent directory for Redis data
        volumeMounts:
        - name: redis
          mountPath: /data

        # Redis will automatically persist .rdb files inside /data

  # --------------------------------------
  # 4) PVC TEMPLATE (One PVC Per Pod)
  # --------------------------------------
  volumeClaimTemplates:
  - metadata:
      name: redis
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: "roboshop-ebs"
      resources:
        requests:
          storage: 1Gi
